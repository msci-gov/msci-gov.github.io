<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>組織案内 | 特別事案調査省 - MSCI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>
    <section class="hero-banner org-hero">
        <div class="container">
            <div class="hero-content">
                <h2>Structure and Authority.</h2>
                <p>国の礎、未来の灯。</p>
            </div>
        </div>
    </section>

    <div class="news-section">
        <div class="container">
            <h3>組織構造 / ORGANIZATION</h3>
            
            <div style="margin-bottom: 40px;">
                <h4 style="color: #002040; border-left: 4px solid #002040; padding-left: 15px;">特別事案調査省 本省</h4>
                <p style="font-size: 0.9rem; color: #666;">事案の検知・分析、及び法的処理の策定を担う中枢組織。</p>
            </div>

            <div style="background: #f8f9fa; padding: 25px; border-radius: 4px;">
                <h4 style="color: #002040; margin-top: 0;">機動捜査庁 (MIA)</h4>
                <p style="font-size: 0.9rem; color: #666;">全国5,000名の執行官による実働部隊。司法警察権を行使し、事案を物理的に抑制する。</p>
                
                <table style="width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.85rem;">
                    <tr style="background: #eee;">
                        <th style="padding: 10px; border: 1px solid #ddd;">管区</th>
                        <th style="padding: 10px; border: 1px solid #ddd;">拠点</th>
                        <th style="padding: 10px; border: 1px solid #ddd;">定員</th>
                    </tr>
                    <tr>
                        <td style="padding: 10px; border: 1px solid #ddd;">東日本</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">東京(立川)</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">1,800名</td>
                    </tr>
                    <tr>
                        <td style="padding: 10px; border: 1px solid #ddd;">西日本</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">大阪・広島</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">1,200名</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
    fetch('header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
        });
</script>

</body>
</html>
