<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>組織案内 | 特別事案調査省 - MSCI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>
    <section class="hero-banner org-hero">
        <div class="container">
            <div class="hero-content">
                <h2>Structure and Authority.</h2>
                <p>組織構造・執行権限</p>
            </div>
        </div>
    </section>

    <div class="content-section">
        <div class="container">
            <div class="org-block">
                <span class="label">CORE ORGANIZATION</span>
                <h3>特別事案調査省 本省</h3>
                <p class="description">
                    国家行政組織法第3条に基づき設置。事案の検知、分析、及び法的処理の策定を担う。
                </p>
                <div class="unit-grid">
                    <div class="unit-card">
                        <h4>情報分析局</h4>
                        <p>国内外の通信データを集積・解析。事案の予兆を検知する。</p>
                    </div>
                    <div class="unit-card">
                        <h4>法務執行室</h4>
                        <p>特別執行権の法的担保、及び司法調整を統括する。</p>
                    </div>
                </div>
            </div>

            <div class="org-block mia-block">
                <span class="label">EXECUTIVE ARM</span>
                <h3>機動捜査庁 (MIA)</h3>
                <div class="mia-summary">
                    <div class="stat"><span>総員</span><strong>5,000名</strong></div>
                    <div class="stat"><span>拠点</span><strong>全国47箇所</strong></div>
                </div>
                <table class="deployment-table">
                    <tr><th>管区</th><th>主要拠点</th><th>定員</th></tr>
                    <tr><td>東日本</td><td>東京(立川)</td><td>1,800</td></tr>
                    <tr><td>西日本</td><td>大阪・広島</td><td>1,200</td></tr>
                    <tr><td>北日本</td><td>札幌・仙台</td><td>800</td></tr>
                    <tr><td>南日本</td><td>福岡・那覇</td><td>500</td></tr>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
    fetch('header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
        });
</script>

</body>
</html>
